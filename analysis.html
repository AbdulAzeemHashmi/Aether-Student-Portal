<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER | Analysis & Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030303;
      --bg-surface: #0a0a0a;
      --border: rgba(255, 255, 255, 0.05);
      --sage: #059669;
      --lavender: #8b5cf6;
      --gold: #f59e0b;
      --red: #ef4444;
      --text-primary: #f8fafc;
      --text-sec: #94a3b8;
      --text-muted: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      perspective: 1200px;
    }

    /* BACKGROUND */
    .background-ambient {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #030303 60%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.12;
      animation: drift 20s infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--lavender); top: -10%; left: -10%; }
    .orb-2 { width: 400px; height: 400px; background: var(--sage); bottom: -10%; right: -10%; animation-delay: -5s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(100px, 50px) scale(1.2); } }

    /* LAYOUT */
    .container { max-width: 1100px; margin: 0 auto; padding: 120px 24px 80px; transform-style: preserve-3d; }
    
    .header {
      position: fixed; top: 0; left: 0; right: 0; height: 76px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
      background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border); z-index: 1000;
    }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .logo-mark { width: 36px; height: 36px; background: linear-gradient(135deg, #6366f1, #3b82f6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk'; font-weight: 700; color: white; }
    .nav-back { color: var(--text-sec); text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .nav-back:hover { color: white; }

    /* PAGE TITLE */
    .page-head { margin-bottom: 64px; text-align: center; transform: translateZ(50px); }
    .chip { display: inline-block; padding: 6px 16px; border-radius: 100px; background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); color: var(--lavender); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
    .title { font-family: 'Outfit', sans-serif; font-size: 56px; font-weight: 800; letter-spacing: -2px; margin-bottom: 12px; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--text-sec); font-size: 18px; max-width: 600px; margin: 0 auto; }

    /* 3D CARDS GRID */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 60px; perspective: 1000px; }
    .card-wrap { perspective: 1000px; }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, border-color 0.3s;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .card:hover { border-color: rgba(255,255,255,0.15); }
    .card-content { transform: translateZ(30px); }
    
    .card-label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
    .card-value { font-family: 'Space Grotesk'; font-size: 64px; font-weight: 700; margin-bottom: 8px; letter-spacing: -3px; }
    .card-desc { font-size: 14px; color: var(--text-sec); line-height: 1.6; }

    /* 3D DECOR */
    .card-glow { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,0.08) 0%, transparent 70%); pointer-events: none; }

    /* RECOMMENDATIONS */
    .rec-section { 
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 56px;
      margin-top: 40px;
      transform: translateZ(20px);
      box-shadow: 0 40px 100px rgba(0,0,0,0.6);
    }
    .rec-title { font-family: 'Outfit'; font-size: 28px; font-weight: 700; margin-bottom: 40px; display: flex; align-items: center; gap: 16px; }
    .rec-title span { color: var(--gold); text-shadow: 0 0 20px var(--gold); }
    
    .rec-list { display: flex; flex-direction: column; gap: 24px; }
    .rec-item {
      display: flex; gap: 24px; padding: 32px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .rec-item:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255,255,255,0.1); transform: translateX(10px) translateZ(10px); }
    
    .rec-icon {
      width: 56px; height: 56px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .rec-icon.priority { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .rec-icon.tip { background: rgba(5, 150, 105, 0.15); color: var(--sage); border: 1px solid rgba(5, 150, 105, 0.3); }
    .rec-icon.warning { background: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); }

    .rec-content h4 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text-primary); }
    .rec-content p { font-size: 15px; color: var(--text-sec); line-height: 1.7; }

    /* ACTION BAR */
    .action-bar { margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--border); display: flex; justify-content: center; }
    .btn-action {
      padding: 20px 40px; border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
      color: white; text-decoration: none; font-weight: 800; font-family: 'Space Grotesk';
      font-size: 18px; letter-spacing: 0.5px; transition: all 0.4s;
      box-shadow: 0 12px 40px rgba(79, 70, 229, 0.4);
    }
    .btn-action:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 20px 60px rgba(79, 70, 229, 0.5); }

    .empty-state {
      height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; border: 2px dashed var(--border); border-radius: 40px; transform: translateZ(-20px);
    }
    .empty-icon { font-size: 80px; margin-bottom: 32px; opacity: 0.1; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .title { font-size: 36px; }
      .subtitle { font-size: 15px; }
      .rec-section { padding: 32px 24px; border-radius: 24px; }
      .rec-item { flex-direction: column; gap: 16px; padding: 24px; }
      .container { padding: 100px 20px 60px; }
      .header { padding: 0 20px; }
    }
    @media (max-width: 600px) {
      .title { font-size: 28px; letter-spacing: -1px; }
      .card { padding: 28px 20px; border-radius: 20px; }
      .card-value { font-size: 48px; }
      .rec-section { padding: 24px 16px; }
      .rec-content h4 { font-size: 15px; }
      .rec-content p { font-size: 13px; }
      .btn-action { padding: 16px 28px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="background-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header class="header">
    <a href="nexus.html" class="logo">
      <div class="logo-mark">Æ</div>
      <div style="display:flex;flex-direction:column;line-height:1">
        <span style="font-family:'Outfit';font-weight:700;letter-spacing:1px;font-size:18px">AETHER</span>
        <span style="font-size:9px;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px">Intelligence</span>
      </div>
    </a>
    <a href="hub.html" class="nav-back">← Back to Animus</a>
  </header>

  <div class="container">
    <div class="page-head">
      <div class="chip">AI Analysis System</div>
      <h1 class="title">Academic Intelligence</h1>
      <p class="subtitle">Deep audit of your academic profile and strategic path optimization.</p>
    </div>

    <div id="dashboard-area">
      <!-- Dynamic Content Here -->
    </div>

    <div class="action-bar">
      <a href="hub.html" class="btn-action">Return to Animus Hub</a>
    </div>
  </div>

  <script>
    const courseData = [
      { id: "NS1001", name: "Applied Physics", cr: 3, sem: 1 },
      { id: "MT1003", name: "Calculus & Geometry", cr: 3, sem: 1 },
      { id: "SS1012", name: "Functional English", cr: 3, sem: 1 },
      { id: "SS1013", name: "Ideology of Pakistan", cr: 2, sem: 1 },
      { id: "CS1005", name: "Intro to ICT", cr: 3, sem: 1 },
      { id: "SS1015", name: "Pakistan Studies", cr: 2, sem: 1 },
      { id: "CS1002", name: "Programming Fundamentals", cr: 4, sem: 1 },
      { id: "SS2043", name: "Civics & Community", cr: 3, sem: 2 },
      { id: "EE1005", name: "Digital Logic Design", cr: 4, sem: 2, prereqs: ["NS1001"] },
      { id: "SS1014", name: "Expository Writing", cr: 3, sem: 2, prereqs: ["SS1012"] },
      { id: "SS1007", name: "Islamic Studies", cr: 2, sem: 2 },
      { id: "MT1008", name: "Multivariable Calculus", cr: 3, sem: 2, prereqs: ["MT1003"] },
      { id: "CS1004", name: "Object Oriented Prog.", cr: 4, sem: 2, prereqs: ["CS1002"] },
      { id: "SS1019", name: "Sirat-Un-Nabi", cr: 2, sem: 2 },
      { id: "EE2003", name: "COAL", cr: 4, sem: 3, prereqs: ["EE1005"] },
      { id: "CS2001", name: "Data Structures", cr: 4, sem: 3, prereqs: ["CS1004"] },
      { id: "CS2005", name: "Discrete Structures", cr: 3, sem: 3 },
      { id: "MT1004", name: "Linear Algebra", cr: 3, sem: 3, prereqs: ["MT1008"] },
      { id: "AI2001", name: "Programming for AI", cr: 4, sem: 3, prereqs: ["CS1002"] },
      { id: "SS1001", name: "Quran I", cr: 1, sem: 3 },
      { id: "CS3005", name: "Database Systems", cr: 4, sem: 4, prereqs: ["CS2001"] },
      { id: "AI2002", name: "Artificial Intelligence", cr: 4, sem: 4, prereqs: ["CS2001", "AI2001"] },
      { id: "CS3004", name: "Fund. of Software Eng.", cr: 3, sem: 4, prereqs: ["CS1004"] },
      { id: "CS2006", name: "Operating Systems", cr: 4, sem: 4, prereqs: ["CS2001"] },
      { id: "MT2005", name: "Probability & Statistics", cr: 3, sem: 4 },
      { id: "SS1002", name: "Quran II", cr: 1, sem: 4 },
      { id: "CS3001", name: "Computer Networks", cr: 4, sem: 5, prereqs: ["CS2006"] },
      { id: "CS3004A", name: "Design & Analysis Algo.", cr: 3, sem: 5, prereqs: ["CS2001"] },
      { id: "AI3001", name: "Knowledge Representation", cr: 3, sem: 5, prereqs: ["AI2002"] },
      { id: "AI3002", name: "Machine Learning", cr: 4, sem: 5, prereqs: ["AI2002"] },
      { id: "SS2007", name: "Tech & Business Writing", cr: 3, sem: 5 },
      { id: "AI3003", name: "Artificial Neural Nets", cr: 3, sem: 6, prereqs: ["AI3002"] },
      { id: "AI4002", name: "Computer Vision", cr: 4, sem: 6, prereqs: ["AI3002"] },
      { id: "CS3006", name: "Parallel & Dist. Comp.", cr: 3, sem: 6, prereqs: ["CS2006"] },
      { id: "AI4091", name: "Final Year Project I", cr: 3, sem: 7 },
      { id: "AI4092", name: "Final Year Project II", cr: 3, sem: 8, prereqs: ["AI4091"] },
      { id: "CS3002", name: "Information Security", cr: 3, sem: 8 }
    ];

    window.onload = function() {
      const profile = JSON.parse(localStorage.getItem('aether_profile') || 'null');
      const area = document.getElementById('dashboard-area');

      if (!profile || !profile.semesters || profile.semesters.length === 0) {
        area.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🌑</div>
            <h2>Quantum Silence</h2>
            <p style="color:var(--text-sec);max-width:400px;margin-top:12px">Your academic intelligence profile is empty. Please configure your profile in the Nexus Map to generate an analysis.</p>
          </div>
        `;
        return;
      }

      const semesters = profile.semesters;
      const n = semesters.length;
      const avgGpa = semesters.reduce((a, s) => a + s.gpa, 0) / n;
      const failed = semesters.flatMap(s => s.failedIds || []);
      const retaking = semesters.flatMap(s => s.retakeIds || []);
      
      const health = Math.max(0, Math.min(100, (avgGpa / 4 * 100) - (failed.length * 8) + (retaking.length * 4)));

      area.innerHTML = `
        <div class="grid">
          <div class="card-wrap">
            <div class="card">
              <div class="card-glow"></div>
              <div class="card-content">
                <div class="card-label">Strategic CGPA</div>
                <div class="card-value" style="color:var(--sage)">${avgGpa.toFixed(2)}</div>
                <div class="card-desc">Average across ${n} archived semesters.</div>
              </div>
            </div>
          </div>
          <div class="card-wrap">
            <div class="card">
              <div class="card-glow"></div>
              <div class="card-content">
                <div class="card-label">Degree Health</div>
                <div class="card-value" style="color:var(--lavender)">${Math.round(health)}%</div>
                <div class="card-desc">Based on performance and backlog density.</div>
              </div>
            </div>
          </div>
          <div class="card-wrap">
            <div class="card">
              <div class="card-glow"></div>
              <div class="card-content">
                <div class="card-label">Active Backlogs</div>
                <div class="card-value" style="color:var(--red)">${failed.length}</div>
                <div class="card-desc">${retaking.length} currently being resolved via retakes.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="rec-section">
          <h3 class="rec-title"><span>✦</span> Intelligence Recommendations</h3>
          <div class="rec-list" id="rec-list"></div>
        </div>
      `;

      renderRecs(profile, failed, retaking, avgGpa);
      init3DEffects();
    };

    function init3DEffects() {
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const xc = rect.width / 2;
          const yc = rect.height / 2;
          const dx = x - xc;
          const dy = y - yc;
          card.style.transform = `rotateY(${dx / 15}deg) rotateX(${-dy / 15}deg)`;
          card.style.setProperty('--mx', `${x}px`);
          card.style.setProperty('--my', `${y}px`);
        });
        card.addEventListener('mouseleave', () => {
          card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });
      });
    }

    function renderRecs(profile, failed, retaking, avgGpa) {
      const list = document.getElementById('rec-list');
      const recs = [];

      // 1. Gatekeeper Analysis
      const dependencyCount = {};
      courseData.forEach(c => {
        if (c.prereqs) c.prereqs.forEach(p => dependencyCount[p] = (dependencyCount[p] || 0) + 1);
      });

      const unaddressed = failed.filter(f => !retaking.includes(f));
      unaddressed.forEach(f => {
        const impact = dependencyCount[f] || 0;
        if (impact > 0) {
          recs.push({
            type: 'priority',
            title: `Critical Block: ${f}`,
            desc: `This course is a "Gatekeeper" unlocking ${impact} future subjects. You MUST prioritize a retake of this course next semester to avoid a degree extension.`
          });
        }
      });

      // 2. Trend Analysis
      if (profile.semesters.length >= 2) {
        const sorted = [...profile.semesters].sort((a,b) => b.sem - a.sem);
        const last = sorted[0].gpa;
        const prev = sorted[1].gpa;
        if (last < prev - 0.25) {
          recs.push({
            type: 'warning',
            title: `Performance Decay Alert`,
            desc: `Your GPA dropped significantly from ${prev.toFixed(2)} to ${last.toFixed(2)}. This suggests burnout or increased difficulty. Consider a lighter credit load for the current semester.`
          });
        } else if (last >= prev) {
          recs.push({
            type: 'tip',
            title: `Growth Trajectory`,
            desc: `Your performance is stable or improving. Your current trend suggests a final degree CGPA of ${(avgGpa + 0.1).toFixed(2)} if maintained.`
          });
        }
      }

      // 3. Health Warnings
      if (avgGpa < 2.3) {
        recs.push({
          type: 'warning',
          title: `Academic Risk Zone`,
          desc: `Your CGPA is approaching the graduation threshold. Prioritize core Computer Science credits over electives to stabilize your transcript.`
        });
      }

      if (recs.length === 0) {
        recs.push({
          type: 'tip',
          title: `Optimal Path Maintained`,
          desc: `No critical anomalies detected in your academic path. Keep maintaining your current study habits.`
        });
      }

      list.innerHTML = recs.map(r => `
        <div class="rec-item">
          <div class="rec-icon ${r.type}">${r.type === 'priority' ? '⚡' : r.type === 'warning' ? '⚠️' : '💡'}</div>
          <div class="rec-content">
            <h4>${r.title}</h4>
            <p>${r.desc}</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
