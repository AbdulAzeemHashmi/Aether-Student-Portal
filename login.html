<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --text: #ffffff;
      --text-muted: #64748b;
      --primary: #6366f1;
      --accent: #ec4899;
      --glass: rgba(10, 10, 10, 0.8);
      --border: rgba(255, 255, 255, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050505 !important;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
    }

    /* Premium Ambient Background */
    .ambient-container { 
      position: fixed; inset: 0; z-index: 0; pointer-events: none; 
      background: #050505;
    }
    .blob {
      position: absolute; border-radius: 50%; filter: blur(150px);
      opacity: 0.15; animation: blob-float 20s infinite alternate;
    }
    .blob-1 { width: 60vw; height: 60vh; background: #4f46e5; top: -10%; left: -10%; }
    .blob-2 { width: 50vw; height: 50vh; background: #ec4899; bottom: -10%; right: -10%; animation-delay: -5s; }
    .blob-3 { width: 30vw; height: 30vh; background: #6366f1; top: 40%; left: 30%; opacity: 0.05; animation-delay: -10s; }
    @keyframes blob-float { 
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(100px, 50px) scale(1.1); }
    }

    .bg-text {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Outfit', sans-serif; font-size: 26vw; font-weight: 900;
      color: rgba(255, 255, 255, 0.005); letter-spacing: -2vw;
      pointer-events: none; z-index: 1; white-space: nowrap;
      text-transform: uppercase; line-height: 1;
    }

    .container {
      position: relative; z-index: 10; width: 100%; max-width: 1300px;
      padding: 0 60px; display: flex; align-items: center; justify-content: space-between;
      gap: 40px;
    }

    /* Left Side Content */
    .hero { max-width: 540px; }
    .hero .tagline {
      display: inline-block; padding: 6px 14px; background: rgba(59, 130, 246, 0.08);
      color: var(--primary); border-radius: 100px; font-family: 'Outfit';
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; margin-bottom: 24px;
    }
    .hero h1 {
      font-family: 'Outfit'; font-size: 72px; font-weight: 800;
      line-height: 0.95; color: var(--text); letter-spacing: -3px; margin-bottom: 28px;
    }
    .hero h1 span {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 20px; color: var(--text-muted); line-height: 1.6;
      max-width: 460px; font-weight: 300;
    }

    /* Auth Card */
    .auth-card-wrap { perspective: 1000px; }
    .auth-card {
      width: 440px; padding: 50px;
      background: var(--glass); backdrop-filter: blur(40px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative; overflow: hidden;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .hero { display: none; }
      .container { justify-content: center; padding: 0 20px; }
      .auth-card-wrap { width: 100%; max-width: 460px; }
      .auth-card { width: 100%; padding: 36px 28px; border-radius: 28px; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .auth-card { padding: 28px 20px; border-radius: 22px; }
      .auth-header h2 { font-size: 26px; }
      .input-field { padding: 14px 18px; font-size: 15px; }
      .btn-submit { padding: 16px; font-size: 16px; }
    }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .auth-header { margin-bottom: 40px; }
    .auth-header h2 { font-family: 'Outfit'; font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .auth-header p { font-size: 15px; color: var(--text-muted); }

    .input-group { margin-bottom: 24px; position: relative; }
    .input-group label {
      display: block; font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; padding-left: 4px;
    }
    .input-field {
      width: 100%; padding: 18px 24px;
      background: rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 20px; color: var(--text); font-family: 'Inter'; font-size: 16px;
      outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .input-field:focus {
      background: rgba(255,255,255,0.05); border-color: var(--primary);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
      transform: translateY(-2px);
    }

    .btn-submit {
      width: 100%; padding: 20px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 20px;
      font-family: 'Outfit'; font-size: 18px; font-weight: 600;
      cursor: pointer; transition: all 0.3s; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
    }
    .btn-submit:hover {
      background: var(--accent); transform: translateY(-3px);
      box-shadow: 0 20px 40px rgba(236, 72, 153, 0.4);
    }

    .auth-footer { text-align: center; margin-top: 35px; font-size: 15px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

    /* 3D Core - Geometric Excellence */
    .canvas-3d {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 600px; height: 600px; pointer-events: none; z-index: 5;
    }
    .shape-wrap {
      width: 100%; height: 100%; transform-style: preserve-3d;
      animation: shape-rotate 60s linear infinite;
    }
    .shape-face {
      position: absolute; top: 50%; left: 50%; width: 340px; height: 340px;
      margin: -170px; background: rgba(99, 102, 241, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .f1 { transform: rotateY(0deg) translateZ(170px); }
    .f2 { transform: rotateY(90deg) translateZ(170px); }
    .f3 { transform: rotateY(180deg) translateZ(170px); }
    .f4 { transform: rotateY(270deg) translateZ(170px); }
    .f5 { transform: rotateX(90deg) translateZ(170px); }
    .f6 { transform: rotateX(-90deg) translateZ(170px); }

    .glow-core {
      position: absolute; top: 50%; left: 50%; width: 120px; height: 120px;
      margin: -60px; background: radial-gradient(circle, #fff 0%, var(--primary) 100%);
      border-radius: 50%; filter: blur(20px); opacity: 0.3;
      box-shadow: 0 0 100px var(--primary);
    }

    @keyframes shape-rotate {
      to { transform: rotateX(360deg) rotateY(360deg); }
    }

    .error-toast {
      padding: 14px; background: rgba(248, 113, 113, 0.15); border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fca5a5; border-radius: 16px; text-align: center;
      font-size: 13px; font-weight: 600; display: none;
      margin-bottom: 24px;
      animation: toast-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="ambient-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="bg-text">NEXUS</div>

  <div class="canvas-3d">
    <div class="shape-wrap">
      <div class="shape-face f1"></div><div class="shape-face f2"></div>
      <div class="shape-face f3"></div><div class="shape-face f4"></div>
      <div class="shape-face f5"></div><div class="shape-face f6"></div>
    </div>
    <div class="glow-core"></div>
  </div>

  <div class="container">
    <div class="hero">
      <div class="tagline">The AETHER Protocol</div>
      <h1>Master Your<br><span>Academic Edge</span></h1>
      <p>Enter a high-performance environment built for the modern scholar. Aether simplifies the complex.</p>
    </div>

    <div class="auth-card-wrap">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Sign In</h2>
          <p>Access your academic workspace.</p>
        </div>
        <div class="error-toast" id="error-toast"></div>
        
        <div class="input-group">
          <label>Roll Number</label>
          <input type="text" id="l-roll" class="input-field" placeholder="24I-2013" autocomplete="off">
        </div>
        
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="l-pass" class="input-field" placeholder="••••••••">
        </div>

        <button class="btn-submit" onclick="handleLogin()">
          Authenticate
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>

        <div class="auth-footer">
          New Explorer? <a href="signup.html">Join AETHER</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Smooth Parallax
    document.addEventListener('mousemove', e => {
      const x = (window.innerWidth / 2 - e.clientX) / 40;
      const y = (window.innerHeight / 2 - e.clientY) / 40;
      
      document.querySelector('.canvas-3d').style.transform = `translate(calc(-50% + ${x*1.5}px), calc(-50% + ${y*1.5}px))`;
      document.querySelector('.bg-text').style.transform = `translate(calc(-50% + ${x*0.5}px), calc(-50% + ${y*0.5}px))`;
      document.querySelector('.auth-card-wrap').style.transform = `rotateY(${x*0.2}deg) rotateX(${y*-0.2}deg)`;
    });

    async function handleLogin() {
      const roll = document.getElementById('l-roll').value;
      const pass = document.getElementById('l-pass').value;
      const btn = document.querySelector('.btn-submit');
      
      if(location.protocol === 'file:') {
        alert("ERROR: You must run the server (python app.py) and open http://localhost:3000 in your browser, not the file itself.");
        return;
      }

      showError("");
      btn.style.opacity = '0.5';
      btn.innerText = 'Authenticating...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({roll, pass})
        });
        const data = await res.json();
        if(data.success) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          location.href = 'hub.html';
        } else {
          showError(data.message);
          resetBtn(btn);
        }
      } catch(e) {
        showError("Server Uplink Failed. Is app.py running?");
        resetBtn(btn);
      }
    }

    function resetBtn(btn) {
      btn.style.opacity = '1';
      btn.innerText = 'Authenticate';
    }

    function showError(m) {
      const toast = document.getElementById('error-toast');
      toast.textContent = m;
      toast.style.display = 'block';
    }
  </script>
</body>
</html>
